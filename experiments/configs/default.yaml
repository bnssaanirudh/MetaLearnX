# MetaLearnX — Default Experiment Configuration
# Reproducible experiment configs — commit this alongside your run artifacts.

experiment:
  name: "default_run"
  random_state: 42
  version: "1.0.0"

dataset:
  target_col: "target"
  task_type: "classification"   # "classification" | "regression"
  test_size: 0.2

meta_features:
  apply_log_transform: true
  embedding_dim: 64
  n_sample_rows: 100
  n_sample_cols: 50

meta_learning:
  top_k_neighbors: 5
  similarity_alpha: 0.5         # 0=handcrafted only, 1=embedding only, 0.5=hybrid
  recommender: "hybrid"         # "knn" | "neural" | "hybrid"

optimization:
  multi_objective: true
  n_trials: null                # null = auto-computed from complexity score
  base_trials: 30
  timeout_seconds: null
  warm_start: true

tracking:
  mlflow_enabled: true
  log_artifacts: true
  log_embeddings: true
